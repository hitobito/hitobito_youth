name: 'Run the tests of all wagons depending on this wagon'

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Use a specific version of the core for the workflow run. Defaults to the branch of the triggering ref, or master.
        type: string
        default: ''
      dependency_wagon_ref:
        description: Use a specific version of this wagon for the workflow run. Defaults to the branch this workflow is started from.
        type: string
        default: ''
      wagon_ref:
        description: Use a specific version of the dependent wagons for the workflow run. Defaults to the branch of the triggering ref, or master.
        type: string
        default: ''
  push:
    branches: [ master, stable ]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - 'VERSION'
  pull_request:
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # auto-cancel previous runs of this same workflow on the same PR, if any are still running
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }} # never cancel runs triggered by the main branch, to allow finding the exact merge that broke a wagon

jobs:
  find-dependent-wagons:
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'run-wagon-tests!') }}
    uses: hitobito/hitobito/.github/workflows/find-dependent-wagons.yml@master

  run-wagon-tests:
    name: 'Run ${{ matrix.wagon.name }} wagon tests'
    needs:
      - find-dependent-wagons
    strategy:
      fail-fast: false
      matrix:
        wagon: ${{ fromJSON(needs.find-dependent-wagons.outputs.wagons) }}
      max-parallel: 5 # needed so the wagon matrix does not occupy all the runners at once

    uses: hitobito/hitobito/.github/workflows/wagon-tests.yml@master
    with:
      wagon_repository: ${{ matrix.wagon.repo }}
      core_ref: ${{ inputs.core_ref || '' }}
      wagon_ref: ${{ inputs.wagon_ref || '' }}
      wagon_dependency_ref: ${{ inputs.dependency_wagon_ref || github.ref }}
    secrets:
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}

  summary:
    needs:
      - find-dependent-wagons
      - run-wagon-tests
    # This job must run in every run of this workflow, including the ones where
    # the matrix was never built, because a job skipped by a condition reports
    # as successful to the branch protection. Skipping it would turn a pull
    # request that never ran the wagon tests into a mergeable one.
    if: ${{ !cancelled() }}
    uses: hitobito/hitobito/.github/workflows/dependent-wagon-tests-green.yml@master
    with:
      find_wagons_result: ${{ needs.find-dependent-wagons.result }}
      wagon_tests_result: ${{ needs.run-wagon-tests.result }}
